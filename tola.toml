# Tola configuration (v0.8.1)
# https://github.com/tola-rs/tola-ssg

# tola help "[site]"
[site]
origin = "https://theperkinrex.github.io"
base-path = "/"
title = "ThePerkinrex"
authors = [{ name = "Juan Mahou" }]
description = "Juan Mahou's blog about programming, tech and whatever I happen to be building."
languages = []
language = "en"

# tola help "[build]"
[build]
entry = "site.typ"
content-dir = "content"
publish-dir = "public"

# tola help "[build.references]"
[build.references]
navigation = "error"
resources = "error"
fragments = "error"

# tola help "[assets]"
[assets]
cache-busting = true
trees = [
  { source = "static/web-assets", url-prefix = "/assets" },
  # Link-preview PNGs, generated by the `og-images` hook below
  { source = "static/og-images", url-prefix = "/og" },
]
# Browser icons (rendered by scripts/make-icons.sh), at the root URLs clients look for
files = [
  { source = "static/favicon.ico", url = "/favicon.ico" },
  { source = "static/apple-touch-icon.png", url = "/apple-touch-icon.png" },
]

# tola help "[vendor]"
[vendor]
path = "vendor"

# Writes site/build-mode.json so drafts render under `tola dev` but never get published.
[[build.hooks.before-build]]
enable = true
name = "build-mode"
command = ["sh", "scripts/build-mode.sh"]
dev = "run"
rerun-on = ["scripts/build-mode.sh"]
generates = ["site/build-mode.json"]

# Renders the SVG images to PNG for link previews (Open Graph doesn't accept SVG). Needs rsvg-convert.
[[build.hooks.before-build]]
enable = true
name = "og-images"
command = ["sh", "scripts/og-images.sh"]
dev = "run"
rerun-on = ["scripts/og-images.sh", "static/web-assets/images"]
generates = ["static/og-images"]

# tola help "[typst.fonts]" — fonts for the PDF versions of posts (browser fonts live in web-assets)
[typst.fonts]
paths = ["static/typst-fonts"]
system = false

# tola help "[formatter]" — used by `tola fmt` and the editor's format-on-save
[formatter]
indent = 2
print-width = 100
prose-wrap = "fill"
