name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TOLA_VERSION: 0.8.1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tola
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="tola-${TOLA_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP"

          # The release asset through the authenticated API (the plain github.com/…/releases/download
          # URL has answered 504 from Actions runners), with a few attempts.
          # Print where the download goes, for debugging. Query strings are cut: the storage
          # redirect carries a temporary signed token, and these logs are public.
          echo "Release:     https://github.com/tola-rs/tola-ssg/releases/tag/v${TOLA_VERSION}"
          gh release view "v${TOLA_VERSION}" --repo tola-rs/tola-ssg --json assets \
            --jq ".assets[] | select(.name == \"$archive\" or .name == \"checksums.txt\") | \"Asset:       \(.url)\nAsset (API): \(.apiUrl)\"" \
            || echo "Could not list the release assets"
          redirect=$(curl -sS -o /dev/null --connect-timeout 20 -w '%{http_code} %{redirect_url}' \
            "https://github.com/tola-rs/tola-ssg/releases/download/v${TOLA_VERSION}/$archive" || true)
          echo "Redirect:    ${redirect%%\?*}"

          download() {
            for attempt in 1 2 3; do
              gh release download "v${TOLA_VERSION}" --repo tola-rs/tola-ssg --clobber \
                --pattern "$archive" --pattern checksums.txt && return 0
              echo "Download attempt $attempt failed; retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            done
            return 1
          }

          if download; then
            grep " $archive\$" checksums.txt | sha256sum --check -
            tar xzf "$archive" -C "$HOME/.local/bin" tola
          else
            echo "::warning::Could not download the Tola release; building it from crates.io instead"
            cargo install tola --version "$TOLA_VERSION" --locked --root "$HOME/.local"
          fi

      - name: Build
        run: |
          tola --version
          tola build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
