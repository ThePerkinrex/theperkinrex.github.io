name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TOLA_VERSION: 0.8.1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tola
        run: |
          archive="tola-${TOLA_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/tola-rs/tola-ssg/releases/download/v${TOLA_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check -
          mkdir -p "$HOME/.local/bin"
          tar xzf "$archive" -C "$HOME/.local/bin" tola
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          tola --version
          tola build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
